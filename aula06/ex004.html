<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font: normal 20pt Arial;
        }
    </style>
</head>
<body>
    <script>
        nome = window.prompt(`Qual é o seu nome?`);
        document.write(`Oi, <strong>${nome}</strong>! Seu nome tem ${nome.length} letras.<br/>`);
        document.write(`Seu nome em letras maiusculas eh ${nome.toUpperCase()}`);
    </script>
</body>
</html>
